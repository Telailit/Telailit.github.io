<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Site · 个人主页</title>

<style>
/* ============================================================
   一、全局变量与基础样式
   以后想换默认配色：直接改下面这几行即可（localStorage 里
   已有用户自定义颜色时会覆盖这里的默认值）
   ============================================================ */
:root {
  --bg: #f4f1ea;          /* 页面背景颜色 */
  --text: #22201c;        /* 主文字颜色（颜色面板不含此项，可在此手动改） */
  --accent-1: #5b7fff;    /* 重点色一：Hero 渐变起点、图标等 */
  --accent-2: #ff8e6e;    /* 重点色二：Hero 渐变终点等 */
  --text-muted: #97907f;  /* 减淡文字颜色：引语、说明文字等 */

  --max-width: 1000px;    /* 全站最大内容宽度 */
  --radius-lg: 32px;      /* Hero / 面板的大圆角 */
}

/* 基础重置 */
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { overflow-x: hidden; }  /* 防止手机端出现横向滚动条 */

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB",
               "Microsoft YaHei", "Segoe UI", sans-serif;
  line-height: 1.6;
  transition: background .3s ease, color .3s ease;
}

/* ============================================================
   二、Hero 悬浮色块
   ============================================================ */
.hero {
  position: relative;
  margin: 24px;                     /* 四周留白 → 形成"悬浮"感 */
  min-height: 62vh;
  border-radius: var(--radius-lg);  /* 32px 大圆角 */
  background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
  display: flex;
  align-items: flex-end;            /* 内容整体靠下 */
  transition: background .3s ease;
}

.hero-content {
  padding: 48px;
  color: #fff;                      /* 色块上用白字，保证对比度 */
}

.site-name {
  font-size: clamp(2.2rem, 6vw, 3.5rem);
  font-weight: 800;
  letter-spacing: .02em;
}

.dash {
  display: block;
  margin: 10px 0 6px;
  font-size: 1.4rem;
  opacity: .85;
}

.quote {
  font-size: .95rem;
  opacity: .8;                      /* 引语颜色减淡 */
  max-width: 34em;
}

/* Hero 右上角：圆形颜色设置按钮 */
.color-btn {
  position: absolute;
  top: 24px;
  right: 24px;
  width: 48px;
  height: 48px;
  border-radius: 50%;               /* 圆形 */
  border: none;
  background: rgba(255, 255, 255, .25);
  backdrop-filter: blur(6px);
  cursor: pointer;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .2s ease, transform .2s ease;
}
.color-btn:hover { background: rgba(255, 255, 255, .45); transform: rotate(30deg); }

/* Lucide 图标尺寸（替换后的 SVG 默认 24×24，这里统一控制） */
.color-btn svg { width: 22px; height: 22px; }

/* ============================================================
   三、主内容区：细线 + 导航说明 + Grid 网格
   ============================================================ */
.container {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 24px 64px;
}

.divider {
  border: none;
  border-top: 1px solid rgba(0, 0, 0, .12);  /* 1px 细横线 */
  margin-bottom: 40px;
}

.nav-desc {
  color: var(--text-muted);         /* 减淡文字 */
  font-size: .95rem;
  margin-bottom: 24px;
}

/* Grid：桌面 3 列，手机 1 列（见下方媒体查询） */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}

/* 网格每一项：圆形图标 + 下方文字链接 */
.card {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  text-decoration: none;
  color: var(--text);
  padding: 32px 16px;
  border-radius: 20px;
  transition: background .2s ease, transform .2s ease;
}
.card:hover { background: rgba(0, 0, 0, .05); transform: translateY(-4px); }

.card-icon {
  width: 56px;
  height: 56px;
  border-radius: 50%;               /* 圆形占位图标 */
  background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 22px;
  margin-bottom: 14px;
  transition: background .3s ease;
}

.card-text { font-size: 1rem; font-weight: 600; }

/* ============================================================
   四、颜色设置面板（Popup）
   ============================================================ */
.popup {
  position: fixed;
  top: 24px;
  right: 24px;
  width: 260px;
  max-width: calc(100vw - 48px);    /* 保证不溢出屏幕 */
  background: #fff;
  border-radius: 24px;              /* 大圆角方形 */
  box-shadow: 0 12px 40px rgba(0, 0, 0, .18);
  padding: 20px;
  z-index: 100;
  /* 默认隐藏，由 JS 加 .open 显示 */
  opacity: 0;
  visibility: hidden;
  transform: translateY(-8px);
  transition: opacity .2s ease, transform .2s ease, visibility .2s;
}
.popup.open { opacity: 1; visibility: visible; transform: translateY(0); }

.popup h2 { font-size: 1rem; margin-bottom: 14px; }

/* 每个颜色选项一行：文字 + 原生颜色选择器 */
.color-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
  font-size: .9rem;
}
.color-row input[type="color"] {
  width: 40px;
  height: 28px;
  border: none;
  border-radius: 8px;
  background: none;
  cursor: pointer;
  padding: 0;
}

/* ============================================================
   五、响应式：768px 以下（手机端）
   ============================================================ */
@media (max-width: 768px) {
  .hero { margin: 12px; min-height: 55vh; }
  .hero-content { padding: 28px; }
  .color-btn { top: 16px; right: 16px; }
  .grid { grid-template-columns: 1fr; }       /* 单列 */
  .popup { top: 12px; right: 12px; }          /* 面板贴边内缩，防溢出 */
}

/* ============================================================
   六、特殊引语：渐变发光效果
   配合 JS 中 glow: true 的配置项使用
   ============================================================ */
.quote.glow {
  font-weight: 700;
  background: linear-gradient(90deg, #ffd76e, #ff9d6e, #ff6ec7, #ffd76e);
  background-size: 300% 100%;         /* 背景加宽，为流动动画做准备 */
  -webkit-background-clip: text;      /* 背景裁剪成文字形状 */
  background-clip: text;
  color: transparent;                 /* 文字透明，露出背景渐变 */
  animation: glow-flow 4s linear infinite;  /* 渐变流动动画 */
  filter: drop-shadow(0 0 8px rgba(255, 200, 120, .6));  /* 发光光晕 */
}

/* 渐变背景位置移动 → 产生流动感 */
@keyframes glow-flow {
  0%   { background-position: 0% 50%; }
  100% { background-position: 300% 50%; }
}
   
</style>

<!-- Lucide 图标 CDN -->
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<!-- ==========================================================
     区块 1：Hero 色块
     ========================================================== -->
<header class="hero">
  <div class="hero-content">
    <h1 class="site-name">My Site</h1>
    <span class="dash">——</span>
    <p class="quote" id="quote"></p>
  </div>
  <button class="color-btn" id="colorBtn" aria-label="颜色设置" title="颜色设置">
    <i data-lucide="palette"></i>
  </button>
</header>

<!-- ==========================================================
     区块 2：主内容（细线 / 导航说明 / Grid）
     以后想加新板块，复制一个 <a class="card"> 即可
     ========================================================== -->
<main class="container">
  <hr class="divider">
  <p class="nav-desc">这里是我的个人角落，随便逛逛：</p>

  <nav class="grid">
    <a class="card" href="#articles">
      <span class="card-icon">文</span>
      <span class="card-text">博客文章</span>
    </a>
    <a class="card" href="#projects">
      <span class="card-icon">码</span>
      <span class="card-text">项目作品</span>
    </a>
    <a class="card" href="#about">
      <span class="card-icon">我</span>
      <span class="card-text">关于我</span>
    </a>
  </nav>
</main>

<!-- ==========================================================
     区块 3：颜色设置面板（默认隐藏）
     ========================================================== -->
<div class="popup" id="colorPopup" role="dialog" aria-label="颜色设置">
  <h2>颜色设置</h2>
  <div class="color-row">
    <label for="pickBg">背景颜色</label>
    <input type="color" id="pickBg" data-var="--bg">
  </div>
  <div class="color-row">
    <label for="pickA1">重点色一</label>
    <input type="color" id="pickA1" data-var="--accent-1">
  </div>
  <div class="color-row">
    <label for="pickA2">重点色二</label>
    <input type="color" id="pickA2" data-var="--accent-2">
  </div>
  <div class="color-row">
    <label for="pickMuted">减淡文字</label>
    <input type="color" id="pickMuted" data-var="--text-muted">
  </div>
</div>

<script>
/* ============================================================
   【引语配置区】★ 想改引语，只动下面这个数组 ★
   ============================================================ */
const quoteConfig = [
  /* ---- 特殊日期 / 条件引语（命中即必定显示）---- */
  { conditionDate: ['02-14','12-25'],glow: true, text: '我好嫉妒啊......' },
  { conditionDate: '10-01', text: '祝Gavi生日快乐（笑）' },

  /* ---- 默认引语（按 weight 加权随机，权重可自行调整）---- */
  { weight: 80, text: '来自于L' },
  { weight: 10, text: '来自于海洋生物L' },
  { weight: 10, text: '来自于弱智L。' },
  { weight: 10, text: '来自于夜晚的孩子L' },
  { weight: 3,  text: '来自于正太控L' },
];

/* ---------------- 引语抽取与渲染逻辑（一般无需改动） ---------------- */
function pickQuote() {
  const now = new Date();
  // 拼出今天的 'MM-DD'，用于匹配 conditionDate
  const today = String(now.getMonth() + 1).padStart(2, '0')
              + '-'
              + String(now.getDate()).padStart(2, '0');

  // 第一优先级：命中特殊条件（日期或自定义函数）的配置，必定显示
  const special = quoteConfig.find(item =>
   (item.conditionDate
    ? [].concat(item.conditionDate).includes(today)   // 支持字符串或数组
    : false) ||
    (item.conditionFn && item.conditionFn())
  );
  if (special) return special;

  // 第二优先级：按 weight 加权随机抽取默认引语
  const defaults = quoteConfig.filter(item => typeof item.weight === 'number');
  const total = defaults.reduce((sum, item) => sum + item.weight, 0);
  let roll = Math.random() * total;
  for (const item of defaults) {
    roll -= item.weight;
    if (roll < 0) return item;
  }
  return defaults[defaults.length - 1]; // 兜底，正常不会走到
}

(function renderQuote() {
  const q = pickQuote();
  document.getElementById('quote').textContent =
    q.text + (q.from ? '  ' + q.from : '');
})();

/* ---------------- 引语抽取与渲染逻辑 ---------------- */
function pickQuote() {
  const now = new Date();
  const today = String(now.getMonth() + 1).padStart(2, '0')
              + '-'
              + String(now.getDate()).padStart(2, '0');

  const special = quoteConfig.find(item =>
    (item.conditionDate
      ? [].concat(item.conditionDate).includes(today)
      : false) ||
    (item.conditionFn && item.conditionFn())
  );
  if (special) return special;

  const defaults = quoteConfig.filter(item => typeof item.weight === 'number');
  const total = defaults.reduce((sum, item) => sum + item.weight, 0);
  let roll = Math.random() * total;
  for (const item of defaults) {
    roll -= item.weight;
    if (roll < 0) return item;
  }
  return defaults[defaults.length - 1];
}

(function renderQuote() {
  const q = pickQuote();
  const quoteEl = document.getElementById('quote');
  quoteEl.textContent = q.text + (q.from ? '  ' + q.from : '');
  if (q.glow) quoteEl.classList.add('glow');
})();

/* ============================================================
   颜色设置面板逻辑
   ============================================================ */
const STORAGE_KEY = 'site-colors';
const colorBtn    = document.getElementById('colorBtn');
const colorPopup  = document.getElementById('colorPopup');
const pickers     = document.querySelectorAll('#colorPopup input[type="color"]');

(function initColors() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) {}
  pickers.forEach(picker => {
    const cssVar = picker.dataset.var;
    if (saved && saved[cssVar]) {
      document.documentElement.style.setProperty(cssVar, saved[cssVar]);
      picker.value = saved[cssVar];
    }
  });
})();

function openPopup()  { colorPopup.classList.add('open'); }
function closePopup() { colorPopup.classList.remove('open'); }

colorBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  colorPopup.classList.contains('open') ? closePopup() : openPopup();
});

document.addEventListener('click', (e) => {
  if (!colorPopup.contains(e.target) && e.target !== colorBtn) closePopup();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closePopup();
});

pickers.forEach(picker => {
  picker.addEventListener('input', () => {
    const cssVar = picker.dataset.var;
    document.documentElement.style.setProperty(cssVar, picker.value);
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch (e) {}
    saved[cssVar] = picker.value;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
  });
});

/* Lucide 图标：把 data-lucide 占位元素替换为 SVG */
lucide.createIcons();
</script>
</body>
</html>
